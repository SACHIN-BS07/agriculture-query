<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KrishiSahay - AI Decision Intelligence</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:white;
    padding:20px;
}

h1{text-align:center;margin-bottom:20px;}

.dashboard{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(350px,1fr));
    gap:20px;
}

.glass{
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(15px);
    border-radius:20px;
    padding:20px;
    border:1px solid rgba(255,255,255,0.2);
    box-shadow:0 8px 32px rgba(0,0,0,0.3);
}

input,select,button{
    width:100%;
    padding:10px;
    margin-top:10px;
    border-radius:10px;
    border:none;
}

button{
    background:#00c9a7;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.result-box{
    margin-top:15px;
    background:rgba(0,0,0,0.3);
    padding:15px;
    border-radius:15px;
}

.risk-meter{
    font-size:22px;
    font-weight:bold;
    margin-top:10px;
}
</style>
</head>
<body>

<h1>🌾 KrishiSahay - AI Agricultural Decision Intelligence</h1>

<div class="dashboard">

<!-- AI Crop Risk Score -->
<div class="glass">
<h3>🧠 AI Crop Risk Score</h3>

<label>Rainfall (mm)</label>
<input type="number" id="rain" value="20">

<label>Temperature (°C)</label>
<input type="number" id="temp" value="32">

<label>Pest Alert Level (0-100)</label>
<input type="number" id="pest" value="60">

<label>Market Fluctuation (%)</label>
<input type="number" id="market" value="40">

<button onclick="calculateRisk()">Calculate Risk</button>

<div class="risk-meter" id="riskResult"></div>
</div>


<!-- Localized District Advisory -->
<div class="glass">
<h3>🌍 District-Based Smart Advisory</h3>

<label>Select District</label>
<select id="district">
<option>Kolar</option>
<option>Mysore</option>
<option>Bangalore Rural</option>
</select>

<label>Crop Type</label>
<select id="crop">
<option>Tomato</option>
<option>Paddy</option>
<option>Onion</option>
</select>

<button onclick="generateAdvisory()">Generate Advisory</button>

<div class="result-box" id="advisoryResult"></div>
</div>


<!-- Farmer Profile Personalization -->
<div class="glass">
<h3>👨‍🌾 Farmer Personalization Engine</h3>

<label>Soil Type</label>
<select id="soil">
<option>Black Soil</option>
<option>Red Soil</option>
<option>Sandy Soil</option>
</select>

<label>Crop Type</label>
<select id="profileCrop">
<option>Tomato</option>
<option>Paddy</option>
<option>Onion</option>
</select>

<label>Land Size (Acres)</label>
<input type="number" id="land" value="2">

<button onclick="generatePlan()">Generate Smart Plan</button>

<div class="result-box" id="planResult"></div>
</div>

</div>

<script>

// 🧠 Risk Score Calculation
function calculateRisk(){
    let rain = parseFloat(document.getElementById("rain").value);
    let temp = parseFloat(document.getElementById("temp").value);
    let pest = parseFloat(document.getElementById("pest").value);
    let market = parseFloat(document.getElementById("market").value);

    let risk = (rain*0.2 + temp*0.2 + pest*0.3 + market*0.3);

    let level = "Low";
    if(risk>60) level="High";
    else if(risk>40) level="Moderate";

    document.getElementById("riskResult").innerHTML =
    `Risk Score: ${risk.toFixed(1)}% (${level})`;
}


// 🌍 District Advisory
function generateAdvisory(){
    let district = document.getElementById("district").value;
    let crop = document.getElementById("crop").value;

    document.getElementById("advisoryResult").innerHTML =
    `${crop} leaf yellowing in ${district} district during high humidity suggests possible fungal infection. 
    Recommended: Apply fungicide and improve drainage.`;
}


// 👨‍🌾 Personalization Engine
function generatePlan(){
    let soil = document.getElementById("soil").value;
    let crop = document.getElementById("profileCrop").value;
    let land = parseFloat(document.getElementById("land").value);

    let fertilizerCost = land * 2500;
    let expectedYield = land * 18;

    document.getElementById("planResult").innerHTML =
    `Crop: ${crop}<br>
     Soil Type: ${soil}<br>
     Recommended Fertilizer: NPK 20:20:20<br>
     Estimated Fertilizer Cost: ₹${fertilizerCost}<br>
     Expected Yield: ${expectedYield} Quintals`;
}

</script>

</body>
</html>
